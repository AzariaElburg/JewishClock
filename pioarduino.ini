; Named pioarduino.ini, not platformio.ini, on purpose (2026-10-25): VS Code's
; PlatformIO extension (the OFFICIAL PlatformIO) treats a folder with a
; platformio.ini as its project and, on every edit of it, installed the 3.x
; framework into its own packages - twice, despite its settings. Without that
; file it leaves this folder alone. Build: CLAUDE.md (pio run -c pioarduino.ini).
[platformio]
; Build output and libraries outside the project folder, which OneDrive backs
; up (2026-10-30) - same folder as utils/local_dirs.py.
build_dir = C:/pio3/jc_clean/pio/build
libdeps_dir = C:/pio3/jc_clean/pio/libdeps

[env:esp32s3]
; pioarduino: the community PlatformIO platform for Arduino-ESP32 3.x (the
; official espressif32 platform stops at 2.x). Exact release, not the moving
; "stable" link. 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5 - 64-bit
; time (the 2.x core had 32-bit time: wrong dates from 19 Jan 2038).
; Switched 2026-10-18, version 2.0.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; Use the standard ID recognized by the registry
board = esp32-s3-devkitc-1
framework = arduino

; Manual overrides for your specific N16R8 hardware
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200

; Project Specifics
board_build.partitions = partitions_forClock.csv
board_build.filesystem = littlefs

; Auto-incrementing build number -> FIRMWARE_VERSION_STR (see scripts/gen_version.py)
extra_scripts = pre:scripts/gen_version.py

; Increase networking stack and enable PSRAM stability
build_unflags = -D ARDUINO_USB_MODE
build_flags =
    ; -D CONFIG_ASYNC_TCP_STACK_SIZE=16384 ; Original value
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192    ; Reduced from 16k to save RAM, per ESPAsyncWebServer recommendation
    ; The web server's task on core 0 (with Wi-Fi), not core 1 (the main
    ; loop = the display): there, at its priority 10 over loop()'s 1, every
    ; slow request froze the screen for as long as it ran (0.9 s per picture
    ; list, measured 2026-10-22 - /api/status displayHitches). Shared data is
    ; guarded by EventsLock / DisplayLock / NTPLock / WiFiLock either way.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    ; Every flash read/write/erase LittleFS does goes through FlashStats.cpp
    ; first (counted and timed, GET /api/debug/flash).
    -Wl,--wrap=esp_partition_read
    -Wl,--wrap=esp_partition_write
    -Wl,--wrap=esp_partition_erase_range
    -D CORE_DEBUG_LEVEL=3
                            ; 0: None (No log output)
                            ; 1: Error (Only errors)
                            ; 2: Warn (Warnings and Errors)
                            ; 3: Info (Information, Warnings, Errors - Default in many builds)
                            ; 4: Debug (Detailed debug messages)
                            ; 5: Verbose (Everything, including technical details)


; Warnings for OUR code only (src/) - build_flags would also apply them to
; every library and bury ours in their noise.
build_src_flags =
    -Wall
    -Wextra

; Exact versions, all of them: a "^" range let a fresh install (new PC, wiped
; .pio/) silently pick up newer releases nobody tested on this clock.
; AsyncTCP and ESPAsyncWebServer especially - same maintainer, developed in
; lockstep, and the source of several bugs here (see CLAUDE.md); upgrade
; them together, deliberately, and test.
; 2026-10-18 (2.0.0, framework 3.x): latest releases of each, checked for
; breaking changes first - AsyncTCP/ESPAsyncWebServer moved from
; mathieucarbou to the ESP32Async organisation (same author); GFX 1.4.6 does
; not build on core 3.x, 1.6.9 does (same NV3041A driver and SPI bus class).
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.1
    moononournation/GFX Library for Arduino @ 1.6.9
    claws/BH1750 @ 1.3.0

; Enable Hardware Debugging via built-in USB
debug_tool = esp-builtin
debug_init_break = tbreak setup